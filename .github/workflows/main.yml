name: Build AI XIR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('AI_XIR_ModMenu_Android_Project.zip').extractall('extracted')"

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-XIR-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
